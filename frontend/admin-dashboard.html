<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="nav">
        <a href="#">Admin Dashboard</a>
        <a href="#" onclick="logout()">Logout</a>
    </div>
    <div class="container">
        <div class="card">
            <h2>Manage Doctors</h2>
            <button onclick="document.getElementById('addDocForm').style.display='block'">Add Doctor</button>
            <div id="addDocForm" style="display:none; margin-top:20px;">
                <form id="docForm">
                    <input type="text" id="name" placeholder="Name" required>
                    <input type="email" id="email" placeholder="Email" required>
                    <input type="password" id="password" placeholder="Password" required>
                    <input type="text" id="specialization" placeholder="Specialization" required>
                    <button type="submit" style="margin-top:10px;">Save Doctor</button>
                </form>
            </div>
            <table>
                <thead>
                    <tr><th>ID</th><th>Name</th><th>Specialization</th><th>Email</th></tr>
                </thead>
                <tbody id="docList"></tbody>
            </table>
        </div>
    </div>
    <script src="js/main.js"></script>
    <script>
        async function loadDoctors() {
            const res = await apiFetch('/doctors');
            if(res.success) {
                const tbody = document.getElementById('docList');
                tbody.innerHTML = res.data.map(d => `<tr><td>${d.id}</td><td>${d.name}</td><td>${d.specialization}</td><td>${d.email}</td></tr>`).join('');
            }
        }
        document.getElementById('docForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await apiFetch('/doctors', {
                method: 'POST',
                body: JSON.stringify({
                    name: document.getElementById('name').value,
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value,
                    specialization: document.getElementById('specialization').value,
                    availableTimes: ['09:00', '10:00', '11:00']
                })
            });
            loadDoctors();
        });
        loadDoctors();
    </script>
</body>
</html>
